
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Database</title>
</head>

<body>

    <h1>Student Database</h1>

    <p id="message">Checking login...</p>

    <label for="name">Student Name:</label>
    <input type="text" id="name">

    <br><br>

    <label for="grade">Student Grade:</label>
    <input type="number" id="grade">

    <br><br>

    <button type="button" id="push" disabled>Push Data</button>
    <button type="button" id="get" disabled>Get Data</button>

    <!-- Firebase libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyANNYsY93OcKSVK2zmzwLZbE4dsd6Dkp5o",
            authDomain: "studentdatabase-cdffb.firebaseapp.com",
            projectId: "studentdatabase-cdffb",
            storageBucket: "studentdatabase-cdffb.firebasestorage.app",
            messagingSenderId: "186596925683",
            appId: "1:186596925683:web:2044f5744aeb41bea25786",
            measurementId: "G-P9H09ZYXS6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        // Connect to Firestore and Authentication
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Get HTML elements
        const name = document.getElementById('name');
        const grade = document.getElementById('grade');
        const push = document.getElementById('push');
        const get = document.getElementById('get');
        const message = document.getElementById('message');

        let isFaculty = false;

        // Check if user is logged in as faculty
        auth.onAuthStateChanged(async (user) => {
            isFaculty = false;
            push.disabled = true;
            get.disabled = true;

            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                const userDoc = await db.collection('users').doc(user.uid).get();

                if (userDoc.exists && userDoc.data().role === "faculty") {
                    isFaculty = true;
                    push.disabled = false;
                    get.disabled = false;
                    message.textContent = "Logged in as faculty.";
                } else {
                    message.textContent = "Faculty access required.";
                }

            } catch (error) {
                console.error("Login error:", error.message);
                message.textContent = "Could not verify faculty access.";
            }
        });

        // Save data to Firestore
        push.addEventListener('click', async function (event) {
            if (!isFaculty) {
                return;
            }

            try {
                const docRef = await db.collection('students').add({
                    name: name.value,
                    grade: Number(grade.value),
                    pass: Number(grade.value) > 50 ? 'pass' : 'fail'
                });

                alert('Your data saved successfully');

            } catch (error) {
                console.error("Firebase error: " + error.message);
                alert("Could not save your data.");
            }
        });

        // Retrieve data from Firestore
        get.addEventListener('click', async function (event) {
            if (!isFaculty) {
                return;
            }

            try {
                const snapshot = await db.collection('students').get();

                snapshot.forEach(doc => {
                    console.log(`Name: ${doc.data().name}
Grade: ${doc.data().grade}
Pass: ${doc.data().pass}`);
                });

            } catch (error) {
                console.error("Firebase error: " + error.message);
                alert("Could not retrieve your data.");
            }
        });
    </script>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Database</title>
</head>

<body>

    <h1>Student Database</h1>

    <label for="name">Student Name:</label>
    <input type="text" id="name">

    <br><br>

    <label for="grade">Student Grade:</label>
    <input type="number" id="grade">

    <br><br>

    <button type="button" id="push">Push Data</button>
    <button type="button" id="get">Get Data</button>

    <!-- Firebase libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>


    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCnalyCtwA5z_fejen8G3H3Cg5civNZMBg",
            authDomain: "myproject-35aa3.firebaseapp.com",
            projectId: "myproject-35aa3",
            storageBucket: "myproject-35aa3.firebasestorage.app",
            messagingSenderId: "266994519476",
            appId: "1:266994519476:web:e85a0a8cb28dcb585436e1"
        };

        // Connect to Firebase
        firebase.initializeApp(firebaseConfig);

        // Connect to Firestore
        const db = firebase.firestore();
        const auth = firebase.auth();


        // Get HTML elements
        const name = document.getElementById('name');
        const grade = document.getElementById('grade');
        const push = document.getElementById('push');
        const get = document.getElementById('get');

        // Save data to Firestore
        push.addEventListener('click', async function (event) {
            try {
                const docRef = await db.collection('students').add({
                    name: name.value,
                    grade: Number(grade.value),
                    pass: Number(grade.value) > 50 ? 'pass' : 'fail'
                });

                alert('Your data saved successfully');

            } catch (error) {
                console.error("Firebase error:" + error.message);
                alert("Could not save your data.");
            }
        });

        // Retrieve data from Firestore
        get.addEventListener('click', async function (event) {
            try {
                const snapshot = await db.collection('students').get();

                snapshot.forEach(doc => {
                    console.log(`Name: ${doc.data().name}
Grade: ${doc.data().grade}
Pass: ${doc.data().pass}`);
                });

            } catch (error) {
                console.error("Firebase error:" + error.message);
                alert("Could not retrieve your data.");
            }
        });
    </script>

</body>

</html>

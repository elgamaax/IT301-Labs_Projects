
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        .valid{color: green}
        .invalid{color: red}
    </style>
</head>
<body>
    <h1>
        Registration Form
    </h1>

<form id="myform">
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter your name" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="Enter your email" required>
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter your password" required>
    <br><br>

    <div id="passwordRules" style="display: none;">
        <p id="length" class="invalid">At least 6 characters</p>
        <p id="special" class="invalid">Must include a special character</p>
        <p id="uppercase" class="invalid">Must include an uppercase letter</p>
    </div>

    <button type="submit">Submit</button>
</form>

<script>
    const form = document.getElementById('myform');
    const password = document.getElementById('password');
    const passwordRules = document.getElementById('passwordRules');

    const lengthRule = document.getElementById('length');
    const specialRule = document.getElementById('special');
    const uppercaseRule = document.getElementById('uppercase');

    form.addEventListener('submit', (event)=>{
        event.preventDefault();
        window.location.href = "success.html";
    });

    password.addEventListener('input', ()=>{
        const passwordValue = password.value;

        passwordRules.style.display = passwordValue.length > 0 ? 'block' : 'none';

        const hasLength = passwordValue.length >= 6;
        const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(passwordValue);
        const hasUppercase = /[A-Z]/.test(passwordValue);

        lengthRule.classList.toggle('valid', hasLength);
        lengthRule.classList.toggle('invalid', !hasLength);

        specialRule.classList.toggle('valid', hasSpecial);
        specialRule.classList.toggle('invalid', !hasSpecial);

        uppercaseRule.classList.toggle('valid', hasUppercase);
        uppercaseRule.classList.toggle('invalid', !hasUppercase);
    });

</script>

</body>
</html>

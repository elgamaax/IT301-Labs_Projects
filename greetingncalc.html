<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting and Calculator</title>
</head>
<body>
    <h1>Greeting and Calculator</h1>

    <form action="#">
        <label>What is your name?</label>
        <input type="text" id="name">
        <button id="greet" type="button">Submit</button>
    </form>
    <p id="greeting"></p>

    <form action='#'>
        <label for="num1">First number:</label>
        <input type="number" id="num1"> <br><br>
        <label for="num2">Second number:</label>
        <input type="number" id="num2"> <br><br>

        <p>Pick:</p>
        <input type="radio" id="add" name="operation" value="add"> Add<br></br>
        <input type="radio" id="subtract" name="operation" value="subtract"> Subtract<br></br>
        <input type="radio" id="multiply" name="operation" value="multiply"> Multiply<br></br>
        <input type="radio" id="divide" name="operation" value="divide"> Divide<br></br>

        <button id="calculate" type="button">Calculate</button>
        <button id="clear" type="button">Clear</button>
    </form>

    <p id="result"></p>

    <script>
       const result = document.getElementById("result");
        const greeting = document.getElementById("greeting");

        document.getElementById("greet").addEventListener("click", function() {
            const name = document.getElementById("name").value;
            greeting.textContent = "Hello " + name;
        })

        document.getElementById("calculate").addEventListener("click", function() {
            const a = document.getElementById("num1").value;
            const b = document.getElementById("num2").value;
            const choice = document.querySelector('input[name="operation"]:checked');

            if (a == "" || b == "") {
                result.textContent = "Enter both numbers";
                return;
            }
            if (choice.value == "add") {
                result.textContent = Number(a) + Number(b);
            }
            if (choice.value == "subtract") {
                result.textContent = Number(a) - Number(b);
            }
            if (choice.value == "multiply") {
                result.textContent = Number(a) * Number(b);
            }
            if (choice.value == "divide") {
                result.textContent = Number(a) / Number(b);
            }
        });

            document.getElementById("clear").addEventListener("click", function() {
                document.getElementById("name").value = "";
                document.getElementById("num1").value = "";
                document.getElementById("num2").value = "";
                greeting.textContent = "";
                result.textContent = "";
                document.querySelector('input[value="add"]').checked = true;
        })

    </script>

</body>
</html>

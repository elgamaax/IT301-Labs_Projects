
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f7fa;
            color: #333;
        }

        header {
            background-color: #450084;
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid #cbb677;
        }

        header h1 {
            margin: 0;
        }

        header p {
            color: #eee;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }

        .dashboard {
            display: flex;
            gap: 20px;
        }

        .box {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
        }

        .left {
            flex: 1;
        }

        .right {
            flex: 1;
        }

        h2 {
            font-size: 21px;
            color: #450084;
            border-bottom: 2px solid #cbb677;
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #bbb;
            box-sizing: border-box;
        }

        button {
            background-color: #450084;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #6b2fa0;
        }

        .clear {
            background-color: #ddd;
            color: #333;
        }

        .clear:hover {
            background-color: #bbb;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            text-align: center;
        }

        .stat {
            padding: 10px;
        }

        .stat h3 {
            font-size: 28px;
            margin: 5px;
            color: #450084;
        }

        .stat p {
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #450084;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        td input {
            width: auto;
        }

        .delete {
            background-color: #c74b4b;
            color: white;
        }

        .delete:hover {
            background-color: #a83232;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 700px) {
            .dashboard {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Manage your assignments and stay on track.</p>
    </header>

    <main>

        <div class="dashboard">

            <div class="left">

                <section class="box">
                    <h2>Add Assignment</h2>

                    <form id="assignmentForm">

                        <label for="name">Assignment Name:</label>
                        <input type="text" id="name"
                               placeholder="Assignment name" required>

                        <label for="course">Class:</label>
                        <input type="text" id="course"
                               placeholder="Class name" required>

                        <label for="date">Due Date:</label>
                        <input type="date" id="date" required>

                        <label for="priority">Priority:</label>
                        <select id="priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>

                        <button type="button">Add Assignment</button>
                        <button type="reset" class="clear">Clear</button>

                    </form>

                    <p id="message"></p>
                </section>

            </div>

            <div class="right">

                <section class="box">
                    <h2>Overview</h2>

                    <div class="stats">

                        <div class="stat">
                            <h3 id="total">1</h3>
                            <p>Total</p>
                        </div>

                        <div class="stat">
                            <h3 id="completed">0</h3>
                            <p>Completed</p>
                        </div>

                        <div class="stat">
                            <h3 id="remaining">1</h3>
                            <p>Remaining</p>
                        </div>

                    </div>
                </section>

                <section class="box">
                    <h2>Find Assignments</h2>

                    <label for="search">Search:</label>
                    <input type="text" id="search"
                           placeholder="Search assignments">

                    <label for="filter">Filter by Status:</label>
                    <select id="filter">
                        <option value="all">All Assignments</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </section>

            </div>

        </div>

        <section class="box">
            <h2>My Assignments</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Assignment</th>
                            <th>Class</th>
                            <th>Due Date</th>
                            <th>Priority</th>
                            <th>Done</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="assignmentList">
                        <tr>
                            <td>Homework 1</td>
                            <td>IT301</td>
                            <td>2026-11-25</td>
                            <td>High</td>
                            <td>
                                <input type="checkbox"
                                       aria-label="Complete Homework 1">
                            </td>
                            <td>
                                <button type="button">Edit</button>
                                <button type="button"
                                        class="delete">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <footer>
        <p>Student Task Manager</p>
    </footer>

</body>
</html>


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f4;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #2e6b4e;
        }

        h2 {
            color: #333;
        }

        section {
            background-color: white;
            max-width: 850px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #dedede;
        }

        .summary {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .summary p {
            font-size: 18px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #2e6b4e;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #205039;
        }

        .delete {
            background-color: #c74b4b;
        }

        .delete:hover {
            background-color: #a83232;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #e3efe7;
        }

        td input {
            width: auto;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Stay organized and keep track of your assignments.</p>
    </header>

    <section>
        <h2>Assignment Summary</h2>

        <div class="summary">
            <p>Total: <strong id="total">1</strong></p>
            <p>Completed: <strong id="completed">0</strong></p>
            <p>Remaining: <strong id="remaining">1</strong></p>
        </div>
    </section>

    <section>
        <h2>Add New Assignment</h2>

        <form id="assignmentForm">

            <label for="name">Assignment Name:</label>
            <input type="text" id="name"
                   placeholder="Enter assignment name" required>

            <label for="course">Class:</label>
            <input type="text" id="course"
                   placeholder="Enter class name" required>

            <label for="date">Due Date:</label>
            <input type="date" id="date" required>

            <label for="priority">Priority:</label>
            <select id="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <button type="button">Add Assignment</button>
            <button type="reset">Clear</button>

        </form>

        <p id="message"></p>
    </section>

    <section>
        <h2>Search Assignments</h2>

        <label for="search">Search:</label>
        <input type="text" id="search"
               placeholder="Search assignments">

        <label for="filter">Filter by Status:</label>
        <select id="filter">
            <option value="all">All Assignments</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
        </select>
    </section>

    <section>
        <h2>My Assignments</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Assignment</th>
                        <th>Class</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th>Done</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="assignmentList">
                    <tr>
                        <td>Homework 1</td>
                        <td>IT301</td>
                        <td>2026-11-25</td>
                        <td>High</td>
                        <td>
                            <input type="checkbox"
                                   aria-label="Complete Homework 1">
                        </td>
                        <td>
                            <button type="button">Edit</button>
                            <button type="button"
                                    class="delete">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer>
        <p>Student Task Manager</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise, fetch and API</title>
</head>
    <style>
        #profile {
            border: 1px solid #ccc;
            padding: 20px;
            width: 350px;
            margin: 20px auto;
            text-align: center;
        }
        #profile img {
            border-radius: 70%;
        }
    </style>



<body>
    <h1>Random User Profile</h1>
    <p>Welcome to my random user profile website</p>

    <script>

        const site = 'https://randomuser.me/api/';
        let img = document.createElement('img');
        let name = document.createElement('p');
        let email = document.createElement('p');
        let phone = document.createElement('p');
        let bttn = document.createElement('button');
        bttn.type = "button";
        bttn.textContent = "Generate Profile";


        let profile = document.createElement('div');
        profile.id = "profile";

        profile.appendChild(img);
        profile.appendChild(name);
        profile.appendChild(email);
        profile.appendChild(phone);
        profile.appendChild(bttn);
        document.body.appendChild(profile);


        const getProfile = async() => {
            try{
            let result = await fetch(site);
            result = await result.json();

            let user = result.results[0];

            console.log(user.picture.large);
            img.src = user.picture.large;
            img.alt = "User profile picture";
            img.style.width = "300px";
            name.textContent = `Name: ${user.name.first} ${user.name.last}`;
            email.textContent = `Email: ${user.email}`;
            phone.textContent = `Phone: ${user.phone}`;

            document.body.appendChild(profile);

            }catch(reason){console.log(reason);}
        }
        bttn.addEventListener('click', getProfile);



    </script>


</body>
</html>

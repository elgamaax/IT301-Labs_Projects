<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in page</title>
</head>

<body>

    <form>
        <label for="email">Email</label>
        <input type="email" id="email">

        <br><br>

        <label for="password">password</label>
        <input type="password" id="password">

        <br><br>

        <button type="button" id="log">log in</button>
    </form>

    <p id="message"></p>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyANNYsY93OcKSVK2zmzwLZbE4dsd6Dkp5o",
            authDomain: "studentdatabase-cdffb.firebaseapp.com",
            projectId: "studentdatabase-cdffb",
            storageBucket: "studentdatabase-cdffb.firebasestorage.app",
            messagingSenderId: "186596925683",
            appId: "1:186596925683:web:2044f5744aeb41bea25786",
            measurementId: "G-P9H09ZYXS6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);

        const db = firebase.firestore();
        const auth = firebase.auth();

        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const log = document.getElementById('log');
        const message = document.getElementById('message');

        log.addEventListener('click', async () => {
            try {
                const cred = await auth.signInWithEmailAndPassword(
                    email.value.trim(),
                    password.value
                );

                const uid = cred.user.uid;
                const userDoc = await db.collection("users").doc(uid).get();
                const role = userDoc.data().role;

                if (role === "faculty") {
                    window.location.href = "Lab17.html";
                } else {
                    window.location.href = "student.html";
                }



            } catch (error) {
                message.textContent = "Login failed. Check your details.";
            }
        });
    </script>

</body>

</html>

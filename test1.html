<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
<style>
 .box{
        width: 50px;
        height: 50px;
        background-color: brown;
        display: inline-block;
    }
    .box2{
        background-color: blueviolet;
        transform: skew(20deg);
    }
</style>
</head>
<body>
    <div class="box"></div>
    <div class="box box2"></div>
    <div class="box"></div>
    <div class="box"></div>
    </div>
</body>
</html>

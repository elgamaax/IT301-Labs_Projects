<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
<style>
    .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 50px;
        height: 100vh;
    }

    .small {
        width: 100px;
        height: 100px;
    }

    .big {
        width: 200px;
        height: 200px;
    }
</style>
</head>
<body>
    <div class="container">
        <img class="small" src="https://picsum.photos/200/200?random=1">
        <img class="big" src="https://picsum.photos/200/200?random=2">
        <img class="small" src="https://picsum.photos/200/200?random=3">
    </div>

</body>
</html>

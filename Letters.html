<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter H</title>

    <style>
        .letter {
            position: relative;
            width: 110px;
            height: 120px;
        }

        .left {
            position: absolute;
            width: 20px;
            height: 120px;
            background-color: orange;
            left: 0;
            top: 0;
        }

        .middle {
            position: absolute;
            width: 110px;
            height: 20px;
            background-color: blue;
            left: 0;
            top: 50px;
        }

        .right {
            position: absolute;
            width: 20px;
            height: 120px;
            background-color: red;
            right: 0;
            top: 0;
        }
    </style>
</head>

<body>

    <div class="letter">
        <div class="left"></div>
        <div class="middle"></div>
        <div class="right"></div>
    </div>

</body>

</html>
